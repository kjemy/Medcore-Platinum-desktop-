name: medcore_desktop
description: "MedCore Platinum Desktop Client — HTTP-only client to Local MedCore Service (zero direct MariaDB access)."
publish_to: 'none'
version: 1.0.0-rc.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  decimal: ^2.3.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
