name: MedCore Platinum Desktop — Official Windows Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Target release tag, branch, or commit SHA to build'
        required: true
        default: 'main'
      build_type:
        description: 'Build Type (EVALUATION or RELEASE)'
        required: true
        default: 'EVALUATION'
        type: choice
        options:
          - EVALUATION
          - RELEASE
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-release:
    name: Build & Package Windows Release
    runs-on: windows-2022

    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"

    steps:
      - name: Checkout Release Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Audit & Enforce Release Source Traceability
        shell: pwsh
        run: |
          $expectedCommit = "713a8a4578cb7f82258b57497afa800346280534"
          $checkedOutSha = git rev-parse HEAD
          $targetRef = "${{ github.event.inputs.target_ref || github.ref_name }}"
          $buildType = "${{ github.event.inputs.build_type }}"
          if (-not $buildType) {
            $buildType = "RELEASE"
          }
          
          Write-Host "============================================================"
          Write-Host "MEDCORE PLATINUM RELEASE SOURCE TRACEABILITY AUDIT"
          Write-Host "============================================================"
          Write-Host "Target Reference    : $targetRef"
          Write-Host "Build Type          : $buildType"
          Write-Host "Triggered GITHUB_SHA: ${{ github.sha }}"
          Write-Host "Checked-out Commit  : $checkedOutSha"
          Write-Host "Expected RC-3 SHA   : $expectedCommit"
          Write-Host "============================================================"
          
          if ($targetRef -eq "v1.0.0-rc.3" -or $targetRef -eq "refs/tags/v1.0.0-rc.3") {
            if ($checkedOutSha -ne $expectedCommit) {
              Write-Error "TRACEABILITY FAILURE: Checked-out commit ($checkedOutSha) does not match authoritative RC-3 commit ($expectedCommit)!"
              exit 1
            }
            Write-Host "TRACEABILITY PASS: Verified exact RC-3 source commit binding."
          } else {
            Write-Host "TRACEABILITY PASS: Verified target branch/commit source ($targetRef -> $checkedOutSha)."
          }
          
          "BUILT_COMMIT=$checkedOutSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_REF=$targetRef" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_TYPE=$buildType" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Windows Support
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Install Desktop Client Dependencies
        working-directory: medcore_desktop
        run: flutter pub get

      - name: Run Static Code Analysis
        working-directory: medcore_desktop
        run: flutter analyze

      - name: Run Desktop Automated Test Suite
        working-directory: medcore_desktop
        run: flutter test

      - name: Install Local Service Dependencies
        working-directory: medcore_local_service
        run: dart pub get

      - name: Run Local Service Static Analysis
        working-directory: medcore_local_service
        run: dart analyze

      - name: Build Local Service Native Binaries
        working-directory: medcore_local_service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build/bin" -Force | Out-Null
          dart compile exe bin/server.dart -o build/bin/medcore_local_service.exe
          dart compile exe bin/commission.dart -o build/bin/medcore_commission.exe

      - name: Build Windows Release Executable
        working-directory: medcore_desktop
        shell: pwsh
        run: |
          if ($env:BUILD_TYPE -eq "EVALUATION") {
            Write-Host "Enabling EVALUATION mode: setting MEDCORE_EVALUATION_BUILD=1"
            $env:MEDCORE_EVALUATION_BUILD = "1"
          } else {
            Write-Host "Standard release mode: protected capture (WDA_EXCLUDEFROMCAPTURE)"
          }
          flutter build windows --release

      - name: Verify Compiled Windows Output
        shell: pwsh
        run: |
          $exePath = "medcore_desktop/build/windows/x64/runner/Release/medcore_desktop.exe"
          $serviceExePath = "medcore_local_service/build/bin/medcore_local_service.exe"
          $commExePath = "medcore_local_service/build/bin/medcore_commission.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "CRITICAL: Release executable not found at $exePath"
            exit 1
          }
          if (-not (Test-Path $serviceExePath)) {
            Write-Error "CRITICAL: Local service executable not found at $serviceExePath"
            exit 1
          }
          if (-not (Test-Path $commExePath)) {
            Write-Error "CRITICAL: Commission CLI executable not found at $commExePath"
            exit 1
          }
          $item = Get-Item $exePath
          $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          $serviceHash = (Get-FileHash -Path $serviceExePath -Algorithm SHA256).Hash
          Write-Host "============================================================"
          Write-Host "COMPILED WINDOWS BINARIES VERIFIED"
          Write-Host "Desktop EXE : $($item.FullName)"
          Write-Host "Desktop Size: $($item.Length) bytes"
          Write-Host "Desktop SHA : $exeHash"
          Write-Host "Service SHA : $serviceHash"
          Write-Host "============================================================"

      - name: Download & Extract Bundled MariaDB 11.4 Win64
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "PREPARING BUNDLED MARIADB 11.4.4 WIN64"
          Write-Host "============================================================"
          $mariadbUrl = "https://archive.mariadb.org/mariadb-11.4.4/winx64-packages/mariadb-11.4.4-winx64.zip"
          $zipPath = "mariadb-11.4.4-winx64.zip"
          $extractDir = "mariadb_extracted"
          
          Write-Host "Downloading MariaDB archive from $mariadbUrl ..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          Invoke-WebRequest -Uri $mariadbUrl -OutFile $zipPath -UseBasicParsing
          
          $downloadItem = Get-Item $zipPath
          $downloadHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          Write-Host "Downloaded Archive Size : $($downloadItem.Length) bytes"
          Write-Host "Downloaded Archive Hash : $downloadHash"
          
          Write-Host "Extracting MariaDB distribution archive..."
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          
          $extractedRoot = Get-ChildItem -Path $extractDir | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $extractedRoot) {
            Write-Error "CRITICAL: Could not find extracted MariaDB directory in $extractDir"
            exit 1
          }
          Write-Host "Extracted MariaDB Directory: $($extractedRoot.FullName)"
          
          "MARIADB_EXTRACTED_ROOT=$($extractedRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MARIADB_ARCHIVE_SHA256=$downloadHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Release Bundle & Generate Manifest
        shell: pwsh
        run: |
          $builtCommit = $env:BUILT_COMMIT
          $releaseRef = $env:RELEASE_REF
          $buildType = $env:BUILD_TYPE
          $runId = "${{ github.run_id }}"
          $runNumber = "${{ github.run_number }}"
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          
          $flutterLine = (flutter --version | Select-Object -First 1)
          $dartLine = (dart --version)

          $sourceDir = "medcore_desktop/build/windows/x64/runner/Release"
          
          $shortSha = if ($builtCommit.Length -ge 7) { $builtCommit.Substring(0, 7) } else { $builtCommit }
          $cleanRef = ($releaseRef -replace '[^a-zA-Z0-9_\-\.]', '-')
          
          if ($releaseRef -eq "v1.0.0-rc.3" -or $releaseRef -eq "refs/tags/v1.0.0-rc.3") {
            if ($buildType -eq "EVALUATION") {
              $artifactBase = "medcore-platinum-windows-v1.0.0-rc.3-self-contained-evaluation"
            } else {
              $artifactBase = "medcore-platinum-windows-v1.0.0-rc.3-self-contained"
            }
          } else {
            if ($buildType -eq "EVALUATION") {
              $artifactBase = "medcore-platinum-windows-$cleanRef-self-contained-eval-$shortSha"
            } else {
              $artifactBase = "medcore-platinum-windows-$cleanRef-self-contained-$shortSha"
            }
          }
          
          $stagingDir = "package_staging/$artifactBase"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          
          # 1. Desktop Client Binaries & Assets
          Copy-Item -Path "$sourceDir/*" -Destination $stagingDir -Recurse -Force
          
          # 2. Local Backend Service & Tools
          $serviceStaging = "$stagingDir/service"
          New-Item -ItemType Directory -Path "$serviceStaging/sql/migrations" -Force | Out-Null
          New-Item -ItemType Directory -Path "$serviceStaging/scripts" -Force | Out-Null
          New-Item -ItemType Directory -Path "$serviceStaging/runtime/security" -Force | Out-Null
          
          Copy-Item -Path "medcore_local_service/build/bin/medcore_local_service.exe" -Destination "$serviceStaging/" -Force
          Copy-Item -Path "medcore_local_service/build/bin/medcore_commission.exe" -Destination "$serviceStaging/" -Force
          Copy-Item -Path "medcore_local_service/sql/migrations/*" -Destination "$serviceStaging/sql/migrations/" -Force
          Copy-Item -Path "medcore_local_service/scripts/*" -Destination "$serviceStaging/scripts/" -Force

          # 3. Bundled MariaDB 11.4 Distribution & Licenses
          $mariadbStaging = "$serviceStaging/mariadb"
          New-Item -ItemType Directory -Path "$mariadbStaging/licenses" -Force | Out-Null
          $mariadbSource = $env:MARIADB_EXTRACTED_ROOT
          Write-Host "Copying MariaDB components from $mariadbSource to $mariadbStaging ..."
          Copy-Item -Path "$mariadbSource/bin" -Destination "$mariadbStaging/bin" -Recurse -Force
          Copy-Item -Path "$mariadbSource/lib" -Destination "$mariadbStaging/lib" -Recurse -Force
          Copy-Item -Path "$mariadbSource/share" -Destination "$mariadbStaging/share" -Recurse -Force

          # License and notices (GPLv2 compliance)
          Copy-Item -Path "$mariadbSource/COPYING" -Destination "$mariadbStaging/licenses/COPYING" -Force
          Copy-Item -Path "$mariadbSource/CREDITS" -Destination "$mariadbStaging/licenses/CREDITS" -Force
          Copy-Item -Path "$mariadbSource/README.md" -Destination "$mariadbStaging/licenses/README.md" -Force
          Copy-Item -Path "$mariadbSource/THIRDPARTY" -Destination "$mariadbStaging/licenses/THIRDPARTY" -Force
          Copy-Item -Path "$mariadbSource/COPYING" -Destination "$mariadbStaging/COPYING" -Force
          Copy-Item -Path "$mariadbSource/CREDITS" -Destination "$mariadbStaging/CREDITS" -Force
          Copy-Item -Path "$mariadbSource/README.md" -Destination "$mariadbStaging/README.md" -Force
          Copy-Item -Path "$mariadbSource/THIRDPARTY" -Destination "$mariadbStaging/THIRDPARTY" -Force

          # 4. Packaging Helpers, Documentation & Runtime Directories
          New-Item -ItemType Directory -Path "$stagingDir/packaging" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir/runtime/mariadb_data" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir/runtime/security" -Force | Out-Null

          Copy-Item -Path "packaging/start_medcore_system.bat" -Destination "$stagingDir/" -Force
          Copy-Item -Path "packaging/commission_technician.bat" -Destination "$stagingDir/" -Force
          Copy-Item -Path "packaging/start_medcore_system.bat" -Destination "$stagingDir/packaging/" -Force
          Copy-Item -Path "packaging/commission_technician.bat" -Destination "$stagingDir/packaging/" -Force
          Copy-Item -Path "packaging/README_INSTALL.txt" -Destination "$stagingDir/" -Force

          $mariadbdExe = "$mariadbStaging/bin/mariadbd.exe"
          if (-not (Test-Path $mariadbdExe)) { $mariadbdExe = "$mariadbStaging/bin/mysqld.exe" }
          $mariadbClientExe = "$mariadbStaging/bin/mariadb.exe"
          if (-not (Test-Path $mariadbClientExe)) { $mariadbClientExe = "$mariadbStaging/bin/mysql.exe" }
          $mariadbInstallExe = "$mariadbStaging/bin/mariadb-install-db.exe"

          $mariadbdHash = (Get-FileHash -Path $mariadbdExe -Algorithm SHA256).Hash
          $mariadbClientHash = (Get-FileHash -Path $mariadbClientExe -Algorithm SHA256).Hash
          $mariadbInstallHash = if (Test-Path $mariadbInstallExe) { (Get-FileHash -Path $mariadbInstallExe -Algorithm SHA256).Hash } else { "N/A" }

          $pkgManifest = [ordered]@{
            "project" = "MedCore Platinum Desktop"
            "release" = $releaseRef
            "build_type" = $buildType
            "package_classification" = "B) Desktop + Local Service + Bundled MariaDB 11.4 Self-Contained Offline Hospital Distribution Package"
            "bundled_mariadb" = $true
            "mariadb_version" = "11.4.4-MariaDB"
            "mariadb_distribution_source" = "archive.mariadb.org (Win64)"
            "mariadb_license" = "GNU General Public License v2 (GPLv2)"
            "mariadb_license_notice" = "MariaDB is free software under GNU GPLv2. Licenses and notices bundled in service/mariadb/licenses/."
            "mariadb_source_url" = "https://archive.mariadb.org/mariadb-11.4.4/source/"
            "mariadb_binary_sha256" = $mariadbdHash
            "mariadb_client_sha256" = $mariadbClientHash
            "mariadb_install_sha256" = $mariadbInstallHash
            "offline_capable" = $true
            "network_isolation_guarantee" = "Service and MariaDB bind strictly to loopback 127.0.0.1; zero external internet connection required."
            "application_commit" = $builtCommit
            "rc3_base_commit" = "713a8a4578cb7f82258b57497afa800346280534"
            "workflow_run_id" = $runId
            "workflow_run_number" = $runNumber
            "build_timestamp" = $timestamp
          }
          $pkgManifest | ConvertTo-Json -Depth 5 | Out-File -FilePath "$stagingDir/release_manifest.json" -Encoding utf8

          $zipName = "$artifactBase.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          
          $zipItem = Get-Item $zipName
          $zipHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          
          $screenAffinity = if ($buildType -eq "EVALUATION") { "WDA_NONE (Screen capture permitted for evaluation)" } else { "WDA_EXCLUDEFROMCAPTURE (Screen capture protected)" }

          $manifest = [ordered]@{
            "project" = "MedCore Platinum Desktop"
            "release" = $releaseRef
            "build_type" = $buildType
            "package_classification" = "B) Desktop + Local Service + Bundled MariaDB 11.4 Self-Contained Offline Hospital Distribution Package"
            "screen_capture_mode" = $screenAffinity
            "branding_logo_integrated" = $true
            "bundled_mariadb" = $true
            "mariadb_version" = "11.4.4-MariaDB"
            "mariadb_distribution_source" = "archive.mariadb.org (Win64)"
            "mariadb_license" = "GNU General Public License v2 (GPLv2)"
            "mariadb_license_notice" = "MariaDB is free software under GNU GPLv2. Licenses and notices bundled in service/mariadb/licenses/."
            "mariadb_source_url" = "https://archive.mariadb.org/mariadb-11.4.4/source/"
            "mariadb_binary_sha256" = $mariadbdHash
            "mariadb_client_sha256" = $mariadbClientHash
            "mariadb_install_sha256" = $mariadbInstallHash
            "offline_capable" = $true
            "network_isolation_guarantee" = "Service and MariaDB bind strictly to loopback 127.0.0.1; zero external internet connection required."
            "application_commit" = $builtCommit
            "rc3_base_commit" = "713a8a4578cb7f82258b57497afa800346280534"
            "workflow_run_id" = $runId
            "workflow_run_number" = $runNumber
            "workflow_name" = "${{ github.workflow }}"
            "build_timestamp" = $timestamp
            "flutter_version" = "$flutterLine"
            "dart_version" = "$dartLine"
            "artifact_name" = $zipName
            "artifact_size_bytes" = $zipItem.Length
            "artifact_sha256" = $zipHash
            "distribution_contents" = @(
              "medcore_desktop.exe (Flutter Desktop Client)",
              "flutter_windows.dll",
              "data/ (Flutter Assets)",
              "service/medcore_local_service.exe (Compiled Standalone Local Service)",
              "service/medcore_commission.exe (Field Technician CLI)",
              "service/mariadb/ (Bundled MariaDB 11.4.4 Win64 Server, Client & Tools)",
              "service/mariadb/licenses/ (MariaDB GPLv2 License, Credits, Notices)",
              "service/sql/migrations/ (17 Schema Migrations V001..V017)",
              "service/scripts/ (MariaDB & Technician Provisioning Scripts)",
              "start_medcore_system.bat (One-Click 10-Stage System Launcher)",
              "commission_technician.bat (Commissioning Shortcut)",
              "README_INSTALL.txt"
            )
          }
          
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          $manifestFile = "release_manifest.json"
          [System.IO.File]::WriteAllText($manifestFile, $manifestJson)
          
          "ARTIFACT_BASE_NAME=$artifactBase" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          Write-Host "============================================================"
          Write-Host "MEDCORE PLATINUM RELEASE ARTIFACT PACKAGED"
          Write-Host "============================================================"
          Write-Host "Artifact Base     : $artifactBase"
          Write-Host "Artifact File     : $zipName"
          Write-Host "Artifact Size     : $($zipItem.Length) bytes"
          Write-Host "Artifact SHA-256  : $zipHash"
          Write-Host "Build Type        : $buildType"
          Write-Host "Screen Capture    : $screenAffinity"
          Write-Host "Bundled MariaDB   : Enabled ($mariadbdHash)"
          Write-Host "Application Commit: $builtCommit"
          Write-Host "============================================================"
          Write-Host "Manifest Content:"
          Write-Host $manifestJson

      - name: Verify Self-Contained Package Integrity
        shell: pwsh
        run: |
          $artifactBase = $env:ARTIFACT_BASE_NAME
          $stagingDir = "package_staging/$artifactBase"
          Write-Host "============================================================"
          Write-Host "VERIFYING SELF-CONTAINED PACKAGE INTEGRITY"
          Write-Host "Target Staging: $stagingDir"
          Write-Host "============================================================"
          
          $criticalFiles = @(
            "$stagingDir/medcore_desktop.exe",
            "$stagingDir/flutter_windows.dll",
            "$stagingDir/start_medcore_system.bat",
            "$stagingDir/commission_technician.bat",
            "$stagingDir/README_INSTALL.txt",
            "$stagingDir/release_manifest.json",
            "$stagingDir/service/medcore_local_service.exe",
            "$stagingDir/service/medcore_commission.exe",
            "$stagingDir/service/mariadb/bin/mariadb.exe",
            "$stagingDir/service/mariadb/bin/mariadb-install-db.exe",
            "$stagingDir/service/mariadb/licenses/COPYING",
            "$stagingDir/service/scripts/provision_mariadb.ps1",
            "$stagingDir/service/scripts/init_database.bat"
          )
          
          $serverExeFound = (Test-Path "$stagingDir/service/mariadb/bin/mariadbd.exe") -or (Test-Path "$stagingDir/service/mariadb/bin/mysqld.exe")
          if (-not $serverExeFound) {
            Write-Error "CRITICAL: MariaDB server executable (mariadbd.exe or mysqld.exe) missing!"
            exit 1
          }
          
          foreach ($f in $criticalFiles) {
            if (-not (Test-Path $f)) {
              Write-Error "CRITICAL: Missing required package file: $f"
              exit 1
            }
          }
          
          # Verify all 17 migrations exist
          $migrations = Get-ChildItem -Path "$stagingDir/service/sql/migrations" -Filter "*.sql"
          Write-Host "Verified $($migrations.Count) SQL migration files (V001..V017)."
          if ($migrations.Count -lt 17) {
            Write-Error "CRITICAL: Expected 17 migrations in staging, found $($migrations.Count)!"
            exit 1
          }
          
          Write-Host "INTEGRITY CHECK PASSED: All bundled server, client, migrations, and licenses verified."

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE_NAME }}
          path: |
            medcore-platinum-windows-*.zip
            release_manifest.json
          if-no-files-found: error
